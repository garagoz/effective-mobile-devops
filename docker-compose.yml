services:

  backend:
    build:
      context: ./backend
    container_name: backend-container
    restart: unless-stopped

    networks:
      - effective-network

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-container
    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-80}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    networks:
      - effective-network

networks:
  effective-network:
    driver: bridge